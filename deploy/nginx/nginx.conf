# ============================================================
# SmartOpsAgent Nginx Configuration
#
# Frontend:
#   /              -> /opt/smartops/frontend
#
# Backend:
#   /api/          -> http://127.0.0.1:8080
#
# AI Service:
#   /ai-api/       -> http://127.0.0.1:8001/api/
#
# Health:
#   /health
# ============================================================


# ------------------------------------------------------------
# Worker Configuration
# ------------------------------------------------------------

worker_processes auto;


events {
    worker_connections 2048;
    multi_accept on;
}


# ------------------------------------------------------------
# HTTP Configuration
# ------------------------------------------------------------

http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;


    # --------------------------------------------------------
    # Basic Performance
    # --------------------------------------------------------

    sendfile on;

    tcp_nopush on;

    tcp_nodelay on;

    keepalive_timeout 65;

    types_hash_max_size 2048;


    # --------------------------------------------------------
    # Upload Limit
    # --------------------------------------------------------

    client_max_body_size 50m;


    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------

    log_format smartops
        '$remote_addr - $remote_user '
        '[$time_local] '
        '"$request" '
        '$status '
        '$body_bytes_sent '
        '"$http_referer" '
        '"$http_user_agent" '
        '"$http_x_forwarded_for"';


    access_log /var/log/nginx/smartops-access.log smartops;

    error_log /var/log/nginx/smartops-error.log warn;


    # --------------------------------------------------------
    # Upstream - Spring Boot Backend
    # --------------------------------------------------------

    upstream smartops_backend {

        server 127.0.0.1:8080;

        keepalive 32;
    }


    # --------------------------------------------------------
    # Upstream - FastAPI AI Service
    # --------------------------------------------------------

    upstream smartops_ai {

        server 127.0.0.1:8001;

        keepalive 16;
    }


    # --------------------------------------------------------
    # Main Server
    # --------------------------------------------------------

    server {

        listen 80;

        listen [::]:80;

        server_name _;


        # ----------------------------------------------------
        # Security / Basic Headers
        # ----------------------------------------------------

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        add_header Referrer-Policy "strict-origin-when-cross-origin" always;


        # ----------------------------------------------------
        # Frontend
        # ----------------------------------------------------

        location / {

            root /opt/smartops/frontend;

            index index.html;

            try_files $uri $uri/ /index.html;
        }


        # ----------------------------------------------------
        # Spring Boot Backend
        #
        # Browser:
        #   /api/servers
        #
        # Backend:
        #   http://127.0.0.1:8080/api/servers
        # ----------------------------------------------------

        location /api/ {

            proxy_pass http://smartops_backend;

            proxy_http_version 1.1;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 30s;

            proxy_send_timeout 60s;

            proxy_read_timeout 60s;


            proxy_buffering off;
        }


        # ----------------------------------------------------
        # AI Service
        #
        # Browser / Agent:
        #   /ai-api/chat
        #
        # FastAPI:
        #   /api/chat
        #
        # Example:
        #
        #   /ai-api/chat
        #       ↓
        #   http://127.0.0.1:8001/api/chat
        # ----------------------------------------------------

        location /ai-api/ {

            proxy_pass http://smartops_ai/api/;

            proxy_http_version 1.1;


            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_connect_timeout 30s;

            proxy_send_timeout 60s;

            proxy_read_timeout 120s;


            # AI Streaming / SSE 预留
            proxy_buffering off;

            proxy_cache off;


            # WebSocket 预留
            proxy_set_header Upgrade $http_upgrade;

            proxy_set_header Connection "upgrade";
        }


        # ----------------------------------------------------
        # Health Check
        # ----------------------------------------------------

        location = /health {

            access_log off;

            default_type text/plain;

            return 200 "smartops-nginx-ok\n";
        }


        # ----------------------------------------------------
        # Robots
        # ----------------------------------------------------

        location = /robots.txt {

            access_log off;

            log_not_found off;
        }


        # ----------------------------------------------------
        # Favicon
        # ----------------------------------------------------

        location = /favicon.ico {

            access_log off;

            log_not_found off;
        }


        # ----------------------------------------------------
        # Static Asset Cache
        # ----------------------------------------------------

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {

            root /opt/smartops/frontend;

            expires 7d;

            add_header Cache-Control "public, max-age=604800";

            try_files $uri =404;
        }


        # ----------------------------------------------------
        # Prevent Access to Sensitive Files
        # ----------------------------------------------------

        location ~ /\. {

            deny all;

            access_log off;

            log_not_found off;
        }


        location ~* \.(env|log|bak|sql|key|pem)$ {

            deny all;

            access_log off;

            log_not_found off;
        }
    }
}